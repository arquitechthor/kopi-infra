# TEMPLATE — copy to secrets.yaml and fill in real base64 values.
# secrets.yaml is in .gitignore — never commit the real file.
#
# Generate base64:  echo -n 'your-value' | base64
#
# Recommended: use kubectl directly to avoid storing the file:
#   kubectl create secret generic kopi-secrets --namespace kopi \
#     --from-literal=postgres-user=<user> \
#     --from-literal=postgres-password=<password> \
#     --from-literal=jwt-secret=<min-32-char-secret>
apiVersion: v1
kind: Secret
metadata:
  name: kopi-secrets
  namespace: kopi
  labels:
    app.kubernetes.io/part-of: kopi-tools
type: Opaque
data:
  # echo -n 'your-db-user' | base64
  postgres-user: REPLACE_ME_BASE64
  # echo -n 'your-db-password' | base64
  postgres-password: REPLACE_ME_BASE64
  # echo -n 'your-jwt-secret-min-32-chars' | base64
  jwt-secret: REPLACE_ME_BASE64
