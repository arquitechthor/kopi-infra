apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../local/kustomization.yaml

# Production overlay: multiple replicas, resource limits, image tags
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Ingress
      name: kopi-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: kopi.yourdomain.com
