apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../local/kustomization.yaml

# Dev overlay: increase replicas and configure dev-specific settings
patches:
  - target:
      kind: Deployment
      name: kopi-auth
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
